# frame-schema.yaml
#
# The schema for output/<slug>/frame.yaml, the whole-engagement state file.
#
# STANDING TIER. This file changes only through the promotion gate in
# framework/analysis-method.md: two occurrences, or one candidate whose blind-agent
# falsification attempt survives. Every change lands in
# framework/analysis-method-CHANGELOG.md.
#
# tools/check_frame_integrity.py reads this file. A frame.yaml whose schema_version
# is unknown to the checker is REFUSED, never silently accepted.

schema_version: 3

# Frame versions this schema still understands. The checker reads THIS list rather
# than comparing equality, so a frame written at an older version keeps validating
# and old acceptance regressions survive a bump. Adding a version is a schema edit,
# never a code edit.
#
# v1 -> v2 (2026-08-13): added segment_completed, status, status_reason, declines.
# Recorded as LEARNING WHILE BUILDING, not as a rule amendment. The standing-tier
# promotion gate exists to stop per-engagement JUDGMENTS being promoted to standing
# by convenience. These are structural fields the run protocol cannot function
# without, discovered by designing the protocol. No rule changed.
#
# v2 -> v3 (2026-08-13): name_surface / measure_surface become IDENTIFIERS, not prose.
# Found by running the gate on a second corpus: F1b compared two free-text surface
# DESCRIPTIONS for equality and fired on 4 of 4 elements, of which 2 were false --
# both said "same line, stated parenthetically with the name", which IS co-location,
# but the strings differed because one carried extra detail. Comparing prose for
# equality was never going to work. The prose is not lost; it moves to the optional
# *_surface_note fields, which nothing compares.
#
# F1b reports CANNOT_RUN on any frame below v3, rather than pretending prose
# surfaces are checkable. That is the three-state rule applied to the schema's own
# history.
supports_frames_at: [1, 2, 3]

# Fields declared `type: identifier` must be short machine-comparable tokens:
# lowercase, no whitespace, [a-z0-9._-], 1-40 chars. Enforced from v3 onward.
# The point is that equality between two of them MEANS something.
identifier_pattern: "^[a-z0-9][a-z0-9._-]{0,39}$"

# ---------------------------------------------------------------------------
# The three judgment classes. Design objective: maximize `derived`, migrate
# `per_engagement` into `standing` only where a falsification attempt fails,
# never by convenience.
# ---------------------------------------------------------------------------
judgment_classes:
  standing:
    decided: once, encoded in the framework
    run_time_cost: free
    owner: nobody
  per_engagement:
    decided: every time, because the problem statement changed
    run_time_cost: the operator's judgment, the scarce resource
    owner: operator
    test: >
      Try to construct a problem statement where the answer flips. If you can, it is
      per_engagement. If you genuinely cannot, it is standing, and the attempt gets
      recorded in the frame's `falsification:` block.
  derived:
    decided: not decided at all, falls out of the two above
    run_time_cost: free
    owner: agent

# The six per-engagement judgment moments this schema demands. Nothing else in a
# frame.yaml requires the operator. If a change to this file adds a seventh, that is
# a design regression and must be argued for explicitly.
judgment_moments:
  1: the problem statement
  2: "the problem type (highest leverage - one call unlocks the whole Section G lookup)"
  3: the two mode parameters
  4: which elements are in the set, and why it closes there
  5: the disposition of each unknown
  6: the recommendation, and any override

# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
fields:

  # ---- META ----
  schema_version: {type: int, required: true, class: derived}
  version: {type: int, required: true, class: derived, note: bumped on every write}
  locked:
    type: bool
    required: true
    class: per_engagement
    note: >
      true marks the version that went in the room. F9 diffs current against the
      most recent locked version. Timestamps cannot do this job; the private data
      backup commits on a fixed interval and carries no semantics.
  locked_at: {type: timestamp, required: false, class: derived}
  engagement: {type: string, required: true, class: derived}

  # ---- RUN STATE (added v2). Derived, never authored by the operator. ----
  segment_completed:
    type: enum
    required: false
    class: derived
    values: [A, B, C, D, LOCK, E]
    note: >
      The resume point. Each segment's first agent asserts this equals its
      predecessor and refuses otherwise, writing nothing and returning the
      mismatch. Absent means no segment has completed yet.
      Deriving the resume point from field-presence alone was the alternative and
      it cannot distinguish "not authored yet" from "authored then abandoned",
      which is exactly the case that loses multi-day state.
  status:
    type: enum
    required: false
    class: per_engagement
    values: [in_progress, awaiting_outcome, complete, abandoned]
    note: >
      `abandoned` is reachable only through the mutation path, requires a
      status_reason, and COUNTS AS A COMPLETED SEGMENT E for acceptance. An
      engagement that dies without a recorded reason teaches the loop nothing,
      which is the failure the acceptance criterion is aimed at.
  status_reason:
    type: string
    required: false
    class: per_engagement
    note: mandatory whenever status is `abandoned`; one line, plus any rule candidate it implies
  declines:
    type: list[{segment, rejected_candidate, reason, at_version}]
    required: false
    class: derived
    note: >
      Segment E declining to change the method. Recorded because a decline that
      costs nothing is how a compounding loop quietly stops compounding: every
      run declines, the changelog fills with "no change", and it reads as
      stability rather than as stall. After two CONSECUTIVE declines the next
      run may not decline; it must apply a change or state the method is at a
      local optimum together with the concrete observation that would reopen it.
      Cross-run, so it must live in the frame -- the checker sees one file plus
      an optional prior and cannot hold this in memory.

  # ---- D1: SPECIFICATION DISCOVERY. Must complete before D2 opens. ----
  d1.problem_statement:
    type: string
    required: true
    class: per_engagement
    judgment_moment: 1
    checks: [F8]
  d1.metric_roles:
    type: map[metric -> enum]
    required: true
    class: per_engagement
    judgment_moment: 1
    values: [target, guardrail, constraint, diagnostic]
    checks: [F8]
    note: >
      ADDED v1.1. The role the LOCKED PROBLEM STATEMENT assigns each metric. Without
      this field F8 has nothing to run against and silently passes.
      A metric declared `guardrail` is a floor to be held, NOT a ranking axis. An
      element that uses a guardrail metric as a ranking input has reassigned its role,
      which is the documented drift: the locked question read "raise <target metric>
      WITHOUT LOSING <guardrail metric>", and a ranking criterion then took the
      guardrail metric as an input. Nothing checked step 2 against step 1.

  d1.problem_type:
    type: enum
    required: true
    class: per_engagement
    judgment_moment: 2
    values: [prioritization, system_design, diagnostic, sizing, product_sense, pen_and_paper, engagement, validation]
    note: keys the framework/method-moves.yaml lookup and the instantiation table
  d1.mode.data_obtainable:
    type: bool
    required: true
    class: per_engagement
    judgment_moment: 3
    note: sets the disposition of unknowns. false = assumption-heavy, true = data requests are live
  d1.mode.shots:
    type: enum
    required: true
    class: per_engagement
    judgment_moment: 3
    values: [one, iterative]
    note: sets the weight on custody and rehearsal
  d1.scope_out:
    type: list[{item, reason}]
    required: true
    class: per_engagement
    note: scope excluded WITH reasons. An empty list is a defect, not a clean scope
  d1.deliverable: {type: "{artifact, audience, format}", required: true, class: per_engagement}

  # ---- D2: DATA DISCOVERY. Stops when these are populated, NOT when the topic is exhausted. ----
  facts:
    type: map[id -> {text, tier, source, first_seen}]
    required: true
    class: derived
    checks: [F2, F8]
    note: >
      tier is A (primary/official), B (reputable secondary), or C (aggregator/crowd).
      first_seen is the `version` at which this fact entered the file. It is what makes
      F2 mechanically checkable: an element citing a fact whose first_seen is LATER than
      the element's own is a retrofitted citation, which is provenance posing as
      derivation. Cheap to record, impossible to reconstruct afterward.
  unknowns:
    type: map[id -> {text, disposition, basis, sensitivity, owner, due}]
    required: true
    class: per_engagement
    judgment_moment: 5
    checks: [F10, F11]
    note: >
      disposition is assumption | question | data_request.
      assumption requires basis + sensitivity. data_request requires owner + due.
      question requires a named human. The disposition changes by mode; the item does not.
  unknowns_undispositioned:
    type: list[string]
    required: false
    class: derived
    note: >
      Recorded at lock time: unknowns that surfaced in D2 and never received a
      disposition. Afterward you can only see what you handled, never what you failed
      to notice. Backfill-impossible.

  # ---- INPUTS REGISTRY. Declared once, referenced by id. ----
  inputs:
    type: map[id -> {name, aka}]
    required: true
    class: per_engagement
    checks: [F3]
    note: >
      THE F3 FIX. Elements reference input ids, never free text. `aka` lists synonyms so
      that two names for the same underlying quantity collide by construction. Free-text
      inputs would sail straight past the exact bug this check exists to catch.
      Costs one extra authoring step per run: declare inputs before writing elements.

  # ---- THE FRAME ----
  elements:
    type: list[{id, name, name_surface, measure, measure_surface, name_surface_note, measure_surface_note, because, inputs, protected, first_seen}]
    required: true
    class: per_engagement
    judgment_moment: 4
    checks: [F1, F2, F3, F8, F9]
    note: >
      measure = the level below the name, short. The cap is a FORM, not a number: it must
      leave the mouth in one breath. The operator's ear outranks any word count.
      because = list of fact ids, and it must be NON-EMPTY. An element with no `because`
      is untraced, and an empty list resolves vacuously, so a check that only validates
      the ids present would pass exactly the element that cites nothing.
      inputs = list of input ids. protected defaults to TRUE for every frame element.

      name_surface / measure_surface ADDED v1.1, changed to IDENTIFIERS in v3.
      F1 says the level below sits "on the surface that names it," and a bare `measure`
      string cannot express WHERE it sits. In the 2026-08-05 reconstruction the criteria
      surface carried no measures at all; three of four were recoverable only from
      surfaces five to seven pages downstream, and the fourth nowhere. That is the
      reachability failure appearing inside F1, and it was invisible until surfaces
      were named.

      THEY ARE IDENTIFIERS, NOT DESCRIPTIONS. `p5`, `slide-8`, `step-1`, `board-left`,
      `spoken`. Same token in both fields = co-located = pass. A v2 run compared prose
      descriptions and produced 2 false failures out of 4 because one string carried
      extra detail the other did not. Two identifiers either match or they do not.
      Put the prose in name_surface_note / measure_surface_note, which nothing compares.
  closure: {type: string, required: true, class: per_engagement, judgment_moment: 4, checks: [F5]}
  exclusions:
    type: list[{element, reason}]
    required: true
    class: per_engagement
    judgment_moment: 4
    checks: [F5]
    note: at least one plausible element deliberately excluded, with its reason
  interaction:
    type: "{type, pairs, opposed_actions}"
    required: true
    class: derived
    checks: [F4]
    note: >
      Filled by a BLIND agent that has seen element names and one-line definitions only,
      never the artifact. An agent holding the artifact rationalises overlap as emphasis.
  falsification:
    type: list[{claim, attempt, survived}]
    required: false
    class: derived
    note: >
      The guard on any standing designation. The documented root error in the 2026-08-05
      engagement was promoting a per-engagement judgment to standing by fiat and then
      shielding the reasoning underneath it. A standing claim carries the attempt that
      justified it.

  # ---- OUTPUT ----
  recommendation.text:
    type: string
    required: true
    class: per_engagement
    judgment_moment: 6
    note: imperative verb + quantified object + named constraint, one sentence
  recommendation.confidence: {type: enum, required: true, class: per_engagement, values: [high, medium, low], checks: [F12]}
  recommendation.next_action: {type: "{who, what}", required: true, class: per_engagement, checks: [F12]}
  overrides:
    type: list[{against, chose, because, holds_unless}]
    required: false
    class: per_engagement
    judgment_moment: 6
    note: >
      The operator disagreed with the workflow, in writing, with a falsifiable release
      condition. ALSO A CANDIDATE-RULE GENERATOR: an override is a rule under test and
      feeds framework/rule-candidates.yaml.

  # ---- LEDGERS. All backfill-impossible; recorded during the run or lost. ----
  compression_ledger:
    type: list[{was, definition_was, now_lives}]
    required: true
    class: derived
    checks: [F9]
    note: '"nowhere on the surface carrying the element" is a defect, not an entry'
  proposals:
    type: list[{stage, proposed, status, reason}]
    required: false
    class: derived
    checks: [F13]
    note: >
      status is accepted | rejected | modified. THE REJECTIONS ARE THE POINT. A system
      that stores only accepted output learns the operator's existing decisions rather
      than improving on them, and the rejection record is the only training signal that
      distinguishes the two.
  check_log:
    type: list[{version, segment, states, counts, clean, fully_covered}]
    required: false
    class: derived
    note: >
      ADDED 2026-08-16. One RAW OBSERVATION per write: what the checker reported at that
      version, rule id to PASS/FAIL/CANNOT_RUN, unaggregated and unreclassified.

      IT IS NOT A VERDICT, AND THAT IS THE POINT. Two definitions of a computed
      `checks_fired` were designed and BOTH saturate: "ever PASSed" because rules with no
      CANNOT_RUN branch always pass eventually, and "ever FAILed" because ordinary
      authoring order fails most content rules at least once on a partly-authored frame.
      Either way every rule looks alive and the demotion gate can never cut anything.
      Recording the observation and letting a future consumer define "fired" is the only
      form of this capture that cannot be wrong at capture time. Per-version history is
      also the part that is impossible to reconstruct afterward.

      NO schema_version BUMP. This field is optional and additive, so a v3 frame without
      it stays valid and `supports_frames_at` is untouched. A bump would force every
      consumer to re-declare support and, done carelessly, would make the checker refuse
      frames it can read perfectly well.

      KNOWN AND DEFERRED, 2026-08-16: this list grows without bound, and it lives INSIDE
      the file that is re-read, re-serialised and re-validated on every write, which is
      O(n^2) in the number of writes. Fine at ten writes, bad at two hundred. The right
      home for an append-only observation log is a sibling `check-log.jsonl`, not the
      CAS'd state file. Deferred deliberately until a real engagement's write count is
      known, because moving it later means migrating live frames.

  checks_fired:
    type: list[rule_id]
    required: true
    class: derived
    note: >
      Which rules actually fired this run. Feeds the demotion gate: a rule with zero
      fires across N runs is decoration. F5's own logic, turned on the rulebook.
  stages_run:
    type: list[{stage, requires_operator, changed_frame}]
    required: true
    class: derived
    note: a stage that never changes the frame is a demotion candidate for the stage itself
  prediction:
    type: "{made_at_version, will_be_probed}"
    required: false
    class: per_engagement
    checks: [F13]
    note: >
      Stamped BEFORE the room, and enforced at lock by F13. Contaminated the instant
      feedback arrives, so it cannot be added later.

      WHAT GETS QUESTIONED, NOT HOW IT WILL GO. `will_break` was dropped 2026-08-14:
      it invites a confidence forecast, and a prepared operator's honest confidence
      forecast is always "it will go well", which carries no information. Where the
      room pushes is a different question from how the operator performs, and only
      the first one is worth recording. Free text is deliberate -- binding each entry
      to an element id was considered and rejected as too costly to maintain, which
      means the comparison against what actually got probed stays manual.

      JUSTIFICATION AMENDED 2026-08-14. This field previously rested on "cold
      self-reads in this corpus are documented as near-perfectly calibrated across
      five consecutive instances". The 2026-08-13 outcome debrief corrected that: the
      calibration was measured against an annotation, not against an outcome, and
      graded against reality the self-read SPLITS BY BLOCK -- the operator identified
      a knowledge gap himself and did not identify a frame defect, because a knowledge
      gap is self-evident and a frame feels coherent from the inside. So this field is
      NOT justified by trusting introspection. It is justified because introspection
      demonstrably does not reach frame defects, which makes the divergence between
      this prediction and a blind agent's prediction the informative quantity. Pairing
      the two is a live candidate, not built.

# ---------------------------------------------------------------------------
# VALIDATION the checker implements. Six of these fail the 2026-08-05 frame,
# which is the acceptance test for tools/check_frame_integrity.py.
# ---------------------------------------------------------------------------
validation:
  F1a: "every element has a non-empty `measure`"
  F1b: "every element's `measure_surface` equals its `name_surface` (the level below sits where the name does)"
  F2a: "every element's `because` is NON-EMPTY and every id in it resolves to a real fact id"
  F2b: "every cited fact's `first_seen` is <= the citing element's `first_seen` (FORWARD-ONLY, see limits)"
  F3: "no input id appears in more than one element's `inputs`"
  F5: "`closure` is non-empty AND `exclusions` has at least one entry with a reason"
  F8a: "every fact cited by an element exists in `facts`"
  F8b: "no element takes as a ranking `input` any metric that `d1.metric_roles` declares a `guardrail`"
  F9: "diff against the most recent `locked: true` version; fail on a dropped `measure` for any element with `protected: true`"
  F10struct: "every unknown has a disposition, and its disposition's required sub-fields are present"
  F12: "`recommendation.confidence` and `recommendation.next_action` are both present"
  F13: "on a `locked: true` frame, `proposals` and `prediction.will_be_probed` are both non-empty (CANNOT_RUN while unlocked)"
  schema: "refuse any frame whose `schema_version` is unknown to this checker"

# What the deterministic layer CANNOT do. Stated so it is never mistaken for coverage.
limits:
  required_is_documentation: >
    `required: true` on a field in this file is DOCUMENTATION. The checker does not
    read it. Only a field named in a `checks:` list is actually enforced, and only to
    the extent that check tests it. Discovered 2026-08-14: `proposals` and
    `prediction` were both marked required and a frame missing both returned clean,
    because no rule in `validation:` asserts field presence. F13 now covers those two
    at lock. EVERY OTHER `required: true` IN THIS FILE IS STILL UNENFORCED -- treat it
    as intent, never as a guarantee, and check the `checks:` key before believing a
    field is protected.
  F2_vocabulary: >
    The deterministic F2 catches a MISSING citation. It cannot catch a citation to a fact
    that is itself provenance rather than derivation. In the 2026-08-05 reconstruction the
    top criterion cited a fact amounting to "<term> is the word the brief uses" - it
    resolves cleanly and PASSES, and it is the canonical F2 failure. The blind agent is
    load-bearing for F2, not a supplement to it.
  F2b_forward_only: >
    Creation order cannot be reconstructed from a finished artifact, so F2b is untestable
    against any retrospective frame and every `first_seen` in one is a placeholder.
  F9_needs_two: >
    F9 requires a prior `locked: true` version. It cannot run on a single-version frame.
  acceptance_test: >
    MEASURED 2026-08-13 by running tools/check_frame_integrity.py against the blind
    reconstruction of the 2026-08-05 frame. Not predicted - the prediction was wrong
    three times and is not recorded here.
    FAIL (7): F1a, F2a, F3, F5, F10struct, F12, F13.
    F13 was added 2026-08-14 and re-measured against the same frame the same day; it
    FAILS. That is substantive, not an artifact of the frame being retrospective: the
    2026-08-05 delivery really did go in the room with `proposals: []` and
    `prediction: null`. Unlike F2b, whose inputs are unknowable after the fact, these
    two are knowably absent -- the run lost them, and a reconstruction cannot and
    should not be able to manufacture either.
    CANNOT_RUN (4): F1b and F8b because the reconstruction predates the surface and
    metric_roles fields; F2b because a finished artifact carries no version history;
    F9 because compression needs two locked versions.
    PASS (1): F8a.
    The headline is F3: i_csat is load-bearing in two elements, which is the exact
    double-count the room interrogated, recovered by set intersection from a frame
    transcribed by an agent that had never read Section F.
    F10struct was NOT on the original nine-rule assessment and found two real defects
    (two assumptions missing basis and sensitivity). A rule nobody thought to apply.

# Not deterministic, delegated. Recorded here so the split has one source of truth.
delegated:
  blind_agent: [F1_quality, F2_quality, F3_distinction_sentence, F4, F5_quality, F8_quality]
  operator: [F6, F7, F10_which_disposition, F11]
