# rule-candidates.yaml
#
# THE HOLDING PEN. Feedback produces candidates here, never direct edits to the
# standing tier (analysis-method.md, frame-schema.yaml, method-moves.yaml,
# deck-rubric.md).
#
# WHY THE GATE EXISTS: without one you accrue a rule per session and arrive at a
# document nobody consumes. Promotion being gated is the only thing keeping the
# standing tier thin enough to be usable.
#
# THE GATE. A candidate promotes when EITHER:
#   (a) occurrences >= 2, or
#   (b) occurrences == 1 AND a blind agent, given ONLY the candidate rule and asked
#       to construct a problem statement where it flips, FAILS to construct one.
#
# The falsification attempt is NEVER run by the operator. Self-policing is the
# documented failure mode this whole ladder exists to route around.
#
# On promotion: move the rule into the relevant standing file, set promoted: yes with
# the tier and date, and write a changelog entry. On rejection: keep the row with
# rejected: yes and the counter-case, so the same candidate does not get re-proposed
# every cycle.
#
# DEMOTION runs the other way. Every run records checks_fired. A standing rule with
# zero fires across N runs gets surfaced here as a demotion candidate. A rule whose
# deletion changes nothing is not a rule.

schema_version: 1

# Candidate template. Copy, do not edit in place.
#
# - id: C001
#   rule: "<the candidate rule, stated plainly>"
#   source: post_hoc | in_flight
#   source_detail: "debrief 2026-08-20 / override in <slug> frame v4 / check F6 waved through"
#   occurrences: 1
#   first_seen: 2026-08-20
#   last_seen: 2026-08-20
#   target_tier: analysis-method | frame-schema | method-moves | deck-rubric | workflow
#   falsification:
#     attempted: no
#     by: null              # must be a blind agent, never the operator
#     counter_case: null    # the problem statement where the rule flips, if one was found
#     survived: null
#   promoted: no
#   rejected: no

candidates:

  - id: C001
    rule: >
      The frame freezes N days before delivery. After the freeze only the ARTIFACT may
      change, never the frame. If the frame changes after the freeze, the rehearsal
      window resets and the delivery date moves, or the change does not ship.
    source: post_hoc
    source_detail: >
      Outcome debrief 2026-08-13 (private debrief record; see coaching/progress/ for the
      dated file). Operator, unprompted: "I think I had all the building blocks, but with
      my pivot, I just didn't have enough time to practice what I needed to say to defend it."
      Independently corroborated: deck v1 on 8/3, v3-lean on 8/4, delivered 8/5; the blind
      reconstruction found a criterion reworded between v1 and the delivered artifact; the
      8/4 debrief already carried a zero-rehearsal note.
    why_it_matters: >
      Reframes the fix. Rehearsal was not skipped through negligence, it was crowded out by
      a late structural change to the thing being rehearsed. "Rehearse more" is a discipline
      rule and discipline rules do not convert. A freeze date is a scheduling gate and
      scheduling gates convert, because they are checkable without in-moment judgment.
    occurrences: 1
    first_seen: 2026-08-13
    last_seen: 2026-08-13
    target_tier: analysis-method
    open_question: >
      What is N? Same-day written prep is documented not to transfer, so N is at least 2.
      Not yet grounded in evidence. Do not encode a number until it is.
    falsification:
      attempted: yes
      by: >
        Three blind agents, 2026-08-14, each given ONLY the rule text plus neutral
        definitions of frame/artifact/delivery/rehearsal, and barred BY NAME from this
        file, analysis-method.md, frame-schema.yaml, deck-rubric.md, output/ and
        coaching/. Two were asked to construct a counter-case (one scenario-first, one
        domain-sweep); the third was asked to attack the rule's internal logic.
      counter_case: >
        FOUND, by 2 of 3. The rule fails when a frame change is EXOGENOUS (the world
        moved, not the author's taste) AND the delivery clock belongs to someone else.
        Agent A: a recommendation whose top option becomes legally unavailable three
        days out, where the board slot is the last before an option expires -- the date
        hatch is self-defeating because the rule RESETS the rehearsal window, so it
        cannot buy the three days that would have sufficed. Agent B: incident response,
        where forensics routinely revises scope and root cause after comms prep begins
        and the clock is statutory; and a steering committee where the client's own
        late data collapses two of four options into one.
      survived: no
    promoted: no
    rejected: yes
    superseded_by: C002
    rejection_reason: >
      The gate promotes at one occurrence only if the falsification attempt FAILS to
      construct a counter-case. Two of three constructed one, so this does not promote.
      Rejected as written; the surviving kernel moves to C002.

      THE CONVERGENCE IS THE FINDING, not either counter-case on its own. Three agents
      attacking from different angles independently named the same defect: the rule
      conflates THE AUTHOR REVISING THE FRAME with THE WORLD INVALIDATING IT, and
      punishes both identically. Agent B put it on the passive voice -- "if the frame
      changes" hides which of the two happened.

      Three further findings, all held for C002:
        1. THE RULE BARS ACTING ON ITS OWN BEST DETECTOR. All three reached this
           unprompted. Rehearsal is the first time the argument is spoken end to end
           under questioning, which makes it the cheapest frame-defect instrument
           available. Agent C's form: if rehearsal never finds frame defects the freeze
           costs nothing and the rule is idle; if it does find them the rule mandates
           ignoring them. There is no state where the rule is both active and
           beneficial on this axis. Given F3 is the check that has fired hardest across
           both corpora, a rule forbidding a late-discovered F3 fix points at the wrong
           failure.
        2. "THE CHANGE DOES NOT SHIP" IS NOT A NEUTRAL NULL OPTION. It prescribes
           fluently defending a structure you now believe is broken. The freeze protects
           FLUENCY, and once correctness is known-broken fluency has negative value: a
           smooth defense of a bad frame converts a structural error into a judgment
           error in the room's eyes.
        3. THE BINARY RESET IS MISCALIBRATED. A rename and a total rebuild carry the
           same price, which is exactly what makes reclassifying a small structural fix
           as "artifact" attractive. The cost model was built for ADDITIVE changes and
           applied to all changes.

      Agent C also showed the frame/artifact split is not a partition of the edit space
      (the frame has no existence apart from the artifact, so classification is always
      an inference, assigned to the party with a schedule incentive), and that the rule
      PUNISHES THE PRECISE FRAME AND EXEMPTS THE VAGUE ONE, since the penalty scales
      with how specifically the frame was stated.
    note: >
      FIRST CANDIDATE PRODUCED BY THE COMPOUNDING LOOP FROM REAL FEEDBACK, AND THE GATE
      STOPPED IT. That is the loop working: a rule that felt right to the operator and
      to Claude was refused entry to the standing tier on evidence, by agents that could
      not see the origin story. Recorded because the near-miss is the evidence that the
      falsification step is load-bearing rather than ceremonial.

  - id: C002
    rule: >
      The frame freezes against AUTHOR REVISION once rehearsal begins. After the freeze the
      author may not restructure the frame because a better structure occurred to them.
      The freeze does NOT bind when the world invalidates the frame: a named external
      trigger (an element is now demonstrably false, or a load-bearing element is missing)
      REOPENS it. A reopen takes the smallest element change that restores correctness and
      costs re-rehearsal of the changed branch, not a reset of the whole window. When the
      date is immovable and the reps are unavailable, the frame ships unchanged WITH a
      rehearsed limitation statement naming what is wrong and which conclusions it does and
      does not move. Silently delivering a frame you believe is broken is never permitted.
    source: post_hoc
    source_detail: >
      Same origin event as C001 (outcome debrief 2026-08-13; see coaching/progress/ for the
      dated file). DERIVED 2026-08-14 by falsifying C001 -- this is the kernel that survived
      three independent blind attacks, not a new observation. Operator disposition the same
      day: reject C001, replace with this.
    why_it_matters: >
      Keeps what C001 got right -- rehearsal is bound to a specific structure, and changing
      the structure silently invalidates the rehearsal -- while removing the two properties
      that made it fail: it no longer punishes the world for moving, and it no longer treats
      "ship what you believe is broken" as a neutral default.
    occurrences: 1
    first_seen: 2026-08-13
    last_seen: 2026-08-14
    target_tier: analysis-method
    open_question: >
      N IS DELIBERATELY ABSENT, and should stay absent. Agent C showed no single number can
      work: the freeze point is driven by two independent clocks -- the REHEARSAL clock (a
      function of frame complexity) and the INFORMATION clock (when other people's inputs
      land, unrelated to your frame). A scalar cannot track two independent variables.
      Days is also the wrong unit; five days with no free evenings is zero reps. Operator
      confirmed 2026-08-14 that the unit should be REPS. Open: what defines "rehearsal has
      begun", and how the changed-branch re-rehearsal cost gets estimated.
    falsification:
      attempted: no
      by: null
      counter_case: null
      survived: null
    promoted: no
    rejected: no
    note: >
      DO NOT PROMOTE ON C001's FALSIFICATION. This rule has never been attacked; it was
      DERIVED from an attack on a different rule, which is not the same thing and is exactly
      the shortcut the gate exists to refuse. It needs its own blind run, and the agents
      must not be shown C001 or this file.

      TWO THINGS THIS REPO ALREADY HAS that make it cheaper than it reads. Agent C's central
      amendment was "the frame must be written down at freeze or it is deniable" -- that is
      frame.yaml, and frame_write.py's spec versions every write to frame.v<N>.yaml, so
      "re-rehearse proportional to the delta" is a DIFF here rather than a judgment call.
      Its second amendment was "downgrading a frame change to artifact-only requires a
      second person, not the author" -- that is blind_canary.py.

  - id: C006
    rule: >
      An element's stated MEASURE must disclose every input it declares. Where the declared
      inputs and the stated measure disagree, the measure is under-disclosing and the
      element is not reachable: a reader (or a room) sees only the measure, so an input
      that drives the element invisibly is a hidden dependency. Run the deterministic
      input-intersection check AND a measure-only blind read, and treat any element flagged
      by one and not the other as under-disclosed until reconciled.
    source: in_flight
    source_detail: >
      2026-08-16, first live run of tools/blind_view.py against the reconstructed 2026-08-05
      frame. The deterministic F3 finds i_csat load-bearing in e1 and e3 by set intersection.
      A blind agent seeing names and measures only (inputs withheld) could NOT find it, and
      the reason is in the frame, not the agent: e1's measure states "CSAT held at or above
      3.7", while e3's measure ("how far a mistake travels: what the journey writes, and
      whether the error is recoverable") never mentions CSAT at all, though e3 declares
      i_csat as an input. Verified directly against the frame.
    occurrences: 1
    first_seen: 2026-08-16
    last_seen: 2026-08-16
    target_tier: frame-schema
    falsification:
      attempted: no
      by: null
      counter_case: null
      survived: null
    promoted: no
    rejected: no
    worked_example:
      element: "Blast radius (e3), 2026-08-05 delivered frame"
      declared_inputs: [i_write_surface, i_csat]
      measure_as_delivered: >
        How far a mistake travels: what the journey writes, and whether the error is
        recoverable inside the conversation or leaves your control.
      defect: >
        The measure declares i_csat as an input and never mentions CSAT. The room read
        CSAT on the criterion anyway (it was on the page), so the omission was in the
        MEASURE LINE, not in the thinking.
      measure_disclosed: >
        How far a mistake travels: what the journey writes, whether the error is
        recoverable inside the conversation or leaves your control, and the DISPERSION of
        CSAT on the affected intents. (Criterion 1 reads CSAT as an outcome LEVEL; this
        reads its VARIABILITY, which is the known way this journey disappoints.)
      why_it_would_have_worked: >
        The distinction between level and dispersion is the exact answer that already
        existed elsewhere in the artifact and never came out of his mouth. Writing the
        measure to disclose its own
        input FORCES that distinction onto the criterion, where the room reads it, instead
        of leaving it in a warn box three slides away. This rule does not merely flag a
        bookkeeping mismatch; on the one real case available it would have prevented the
        failure.

    note: >
      EVIDENCE, from the delivery debrief. The interviewer asked, in substance, how the two
      criteria differed when both of them named the same quality metric. So i_csat on e3 is
      an ACCURATE record of what was delivered, not a transcription error, and the debrief
      calls it "a genuine MECE violation." The operator's initial read was that the metric
      had been wrongly attached; the transcript overruled it. FIX IS (a) FIX THE MEASURE,
      not (b) remove the input.
      (Paraphrased deliberately: the debrief holds the verbatim line, and a private
      interviewer's speech does not belong in a public file even unattributed.)

      DO NOT EDIT THE LOCKED FRAME TO APPLY THIS. Considered and rejected 2026-08-16. The
      reconstruction records what went in the room, and what went in the room is a measure
      that did not disclose CSAT -- that omission IS the finding. Editing it would make the
      frame claim a delivery that never happened and would delete this rule's only evidence.
      Writing a second "corrected" frame was also rejected: locked: true means "this went in
      a room", so a corrected locked frame fabricates a lock, and it would have tested F9's
      PASS path (the correction ADDS disclosure) rather than its FAIL path, which needs a
      purpose-built fixture instead. The corrected measure lives HERE, above, which is where
      a future author meets it.

      WHY THIS IS NOT JUST F3 AGAIN. F3 checks DECLARED-input overlap; the blind read checks
      SEMANTIC overlap in what the measures actually say. They answer different questions,
      and the divergence between them is the informative quantity. That is also the argument
      for keeping `inputs` WITHHELD from the interaction view: handing them over would make
      the agent re-derive, expensively and worse, what set intersection already does exactly.

      TWO READINGS OF THE e3 CASE, and they need different fixes. Either (a) e3 really does
      use CSAT and its measure under-discloses -- fix the measure -- or (b) i_csat does not
      belong on e3 and the declaration is wrong -- fix the inputs, which would also retire
      the documented F3 failure. NOT YET RECONCILED. Deciding it needs the operator, because
      only he knows what e3 was actually meant to weigh.

      MECHANISABLE FORM, if this promotes: a check cannot match input ids against free-text
      measures reliably (that is the prose-comparison trap frame-schema v3 exists to avoid).
      The tractable version is a REPORT, not a rule: emit each element's declared inputs
      beside its measure and require the operator to confirm each input is visible in the
      measure. One judgment moment, and it would have caught this at authoring time.

      WHAT THE BLIND AGENT ACTUALLY RETURNED, recorded because a future reader will assume it
      found the known defect and it did not: it flagged e1xe3 as OVERLAPPING but on write
      privilege, and argued opposite valence makes that a tradeoff rather than a double-count.
      It headlined a DIFFERENT pair (e2xe3, shared write integrations) at ~70% with a concrete
      falsifier. Plausible, unverified, not acted on. It did pass the calibration check on e4's
      null measure, and added that an unmeasured criterion with an evocative name is precisely
      where other elements' content gets re-imported as narrative and counted twice invisibly.

  - id: C004
    rule: >
      An append-only observation log does not belong inside a compare-and-swapped state
      file. The state file is re-read, re-serialised and re-validated on every write, so
      an unbounded log inside it makes each write O(total writes so far). Append-only
      records belong in a sibling file whose growth costs the state path nothing.
    source: in_flight
    source_detail: >
      check_log was built into frame.yaml on 2026-08-16 knowing this. Fine at ten writes,
      bad at two hundred. Deferred deliberately: the right threshold is unknown until a
      real engagement's write count exists, and moving it later means migrating live
      frames, so the decision was left to evidence rather than guessed at now.
    occurrences: 1
    first_seen: 2026-08-16
    last_seen: 2026-08-16
    target_tier: frame-schema
    falsification:
      attempted: no
      by: null
      counter_case: null
      survived: null
    promoted: no
    rejected: no
    note: >
      REOPEN GATE, and it is measurable rather than a date: reopen when any single
      engagement's frame.yaml exceeds ~50 check_log rows, or when a write takes visibly
      long. The migration is mechanical (move the list to check-log.jsonl beside the
      frame, keyed by version) but it is NOT free once frames exist in the wild, which is
      the whole reason to decide it on evidence rather than on the day.

  - id: C005
    rule: >
      A file holding a metric that no other file can reconstruct must carry the same
      durability discipline as the file it measures. If frame.yaml gets compare-and-swap,
      a snapshot per write, and byte-identical-on-failure, then answers.yaml, which is the
      SOLE source of operator_answer_count and re_ask_count, cannot have none of them.
    source: in_flight
    source_detail: >
      answers-add shipped 2026-08-16 with correct lock ORDERING (frame lock, then answers
      lock, matching the order frame writes take, so a concurrent frame write cannot
      interleave) and a monotonic row_index so a lost row shows as a gap. It has no CAS,
      no version, and no snapshot. A truncation or a bad restore silently loses the
      numerator for the governing objective.
    occurrences: 1
    first_seen: 2026-08-16
    last_seen: 2026-08-16
    target_tier: frame-schema
    falsification:
      attempted: no
      by: null
      counter_case: null
      survived: null
    promoted: no
    rejected: no
    note: >
      DEFERRED ON AN EXPLICIT OPERATOR CALL, 2026-08-16: build the simplest thing that is
      genuinely backfill-impossible, and durability hardening is not that. Recorded here so
      the gap is a position rather than an oversight.

      REOPEN GATE: the first time an answers.yaml is lost, truncated, or restored from an
      older copy, or the first time re_ask_count is used in an argument that matters. The
      cheap fix is answers.vN.yaml on every append, mirroring frame.vN.yaml.

      THE ASYMMETRY IS THE ARGUMENT. frame.yaml is defended by four guarantees, each paid
      for by a specific past failure. answers.yaml holds the metric the whole method is
      optimised against and is defended by none of them.

  - id: C003
    rule: >
      A wrapper that re-derives a verdict from a subprocess must REFUSE anything it does
      not positively recognise as a judgement: exit code in the callee's documented judged
      set, the expected status, and the fields a real verdict carries all present.
      Default-allow on an unrecognised verdict shape is a bypass, not a pass.
    source: in_flight
    source_detail: >
      tools/frame_write.py's run_checker read a `status: refused` verdict as a pass,
      disabling validation for an engagement permanently. Found by /plan-hardening
      2026-08-15 and reproduced live before the fix.
    occurrences: 1
    first_seen: 2026-08-15
    last_seen: 2026-08-15
    target_tier: analysis-method
    falsification:
      attempted: no
      by: null
      counter_case: null
      survived: null
    promoted: no
    rejected: no
    note: >
      WHY analysis-method AND NOT workflow. This is not a generic engineering tip. It is
      the method's existing three-state rule applied one level up. The method already says
      that collapsing CANNOT_RUN into PASS produces a green result that means nothing and
      reads like coverage; this defect is the identical shape applied to the CHECKER'S
      WRAPPER, collapsing `refused` into `pass`. The rule generalises: wherever one
      component judges and another interprets the judgement, the interpreter must
      enumerate what counts as a judgement rather than assume anything it fails to
      recognise is fine.

      THE MEASURED FORM OF THE FAILURE, kept because it is the cheap tell. Every poisoned
      write returned `clean: null, fully_covered: null, counts: null` alongside
      `status: ok`. The evidence that the verdict judged nothing was present in the
      success payload, on every single write, and nothing looked at it.

      NOT PROMOTED ON DISCOVERY. One occurrence. It promotes only on a second, or on a
      blind agent failing to construct a problem statement where it flips. The agents must
      not be shown this file.

